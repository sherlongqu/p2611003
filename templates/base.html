{{define "head"}}<!DOCTYPE html>
<html lang="en-US" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="{{.MetaDescription}}">
{{if .Canonical}}<link rel="canonical" href="{{.Canonical}}">{{end}}
<link rel="alternate" type="application/rss+xml" title="{{.SiteName}}" href="/feed.xml">
{{if .Robots}}<meta name="robots" content="{{.Robots}}">{{end}}
<meta property="og:site_name" content="{{.SiteName}}">
<meta property="og:type" content="{{.OGType}}">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{.OGTitle}}">
<meta property="og:description" content="{{.MetaDescription}}">
{{if .Canonical}}<meta property="og:url" content="{{.Canonical}}">{{end}}
{{if .OGImage}}<meta property="og:image" content="{{.OGImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{.OGTitle}}">
{{end}}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.OGTitle}}">
<meta name="twitter:description" content="{{.MetaDescription}}">
{{if .OGImage}}<meta name="twitter:image" content="{{.OGImage}}">{{end}}
{{if .JSONLD}}<script type="application/ld+json" nonce="{{.Nonce}}">{{.JSONLD}}</script>{{end}}
<meta name="theme-color" content="#f7f5ef">
<link rel="icon" href="{{asset "favicon.svg"}}" type="image/svg+xml">
<script src="{{asset "theme-init.js"}}"></script>
<link rel="stylesheet" href="{{asset "style.css"}}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{end}}

{{define "nav"}}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="Home">
      <svg class="brand-mark" viewBox="0 60 200 80" aria-hidden="true" focusable="false"><text x="100" y="100" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="currentColor">ARCH</text></svg>
    </a>
    <div class="nav-tools">
      <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"></path></svg>
      </button>

    </div>
  </div>
</header>
{{end}}

{{define "footer"}}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="foot-brand">
      <svg class="brand-mark brand-mark-sm" viewBox="0 60 200 80" aria-hidden="true" focusable="false"><text x="100" y="100" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="currentColor">ARCH</text></svg>
    </div>
    <div class="foot-links">
      <a href="/feed.xml">RSS</a>
      <span>© {{.Year}}</span>
    </div>
  </div>
</footer>
<script src="{{asset "app.js"}}" defer></script>
</body>
</html>
{{end}}
