{{define "login"}}{{template "head" .}}{{template "nav" .}}
<main id="main" class="auth-wrap">
  <form class="panel auth-card" method="post" action="/studio">
    <svg class="brand-mark auth-mark" viewBox="0 60 200 80" aria-hidden="true" focusable="false"><text x="100" y="100" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="currentColor">ARCH</text></svg>
    <p class="eyebrow">{{.SiteName}} · Studio</p>
    <h1>Studio sign in</h1>
    <p class="auth-note">Enter the admin key configured at deployment to publish, replace and remove documents.</p>
    {{if .Error}}<div class="alert" role="alert">{{.Error}}</div>{{end}}
    <label class="field">
      <span>Admin key</span>
      <input type="password" name="key" autocomplete="current-password" placeholder="Enter your key" autofocus required>
    </label>
    <input type="hidden" name="next" value="{{.Next}}">
    <button type="submit" class="btn btn-solid btn-block">Sign in</button>
    <a class="auth-back" href="/">← Back to library</a>
  </form>
</main>
{{template "footer" .}}{{end}}
